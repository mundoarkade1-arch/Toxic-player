
name: Compilar APK e publicar Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Definir versão automática
        run: |
          echo "APP_VERSION=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Restaurar chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || {
            echo "Erro: configure o secret KEYSTORE_BASE64"
            exit 1
          }
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/release.jks
          test -s app/release.jks

      - name: Compilar APK assinado
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          gradle assembleRelease --no-daemon

      - name: Verificar APK
        run: |
          ls -lh app/build/outputs/apk/release/*.apk
          test -n "$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"

      - name: Publicar novo Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v1.0.${{ github.run_number }}
        run: |
          gh release create "$TAG" \
            app/build/outputs/apk/release/*.apk \
            --title "Toxic Player $APP_VERSION" \
            --notes "Versão automática $APP_VERSION
          Commit: $GITHUB_SHA"
          
