name: Limpar
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apagar arquivos velhos
        run: |
          git config user.name "limpeza"
          git config user.email "limpeza@users.noreply.github.com"
          git rm -f --ignore-unmatch AUDITORIA_FASE_C.md AudioFx.kt Biquad.kt BiquadTest.kt COLE-NO-GITHUB_build.yml DspCore.kt DspCoreTest.kt DspProcessor.kt Fft.kt FftTest.kt MainActivity.kt PlaybackService.kt PlayerViewModel.kt Screens.kt Track.kt
          git rm -rf --ignore-unmatch Toxic-player docs
          git commit -m "Limpeza dos arquivos velhos [skip ci]" || echo "nada para apagar"
          git push
